<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOFOMO — Create Your Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #050505;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* Background glow */

        body::before {
            content: "";
            position: fixed;

            width: 500px;
            height: 500px;

            background: #ffb300;
            filter: blur(180px);

            opacity: 0.08;

            top: -200px;
            left: -150px;

            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;

            width: 400px;
            height: 400px;

            background: #ff6f00;
            filter: blur(180px);

            opacity: 0.06;

            right: -150px;
            bottom: -200px;

            pointer-events: none;
        }

        /* Main card */

        .card {
            width: 92%;
            max-width: 500px;

            padding: 35px;

            background: rgba(18, 18, 18, 0.95);

            border: 1px solid #333;
            border-radius: 28px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.7);

            text-align: center;

            position: relative;
            z-index: 2;
        }

        /* Logo */

        .logo {
            font-size: 55px;

            margin-bottom: 5px;

            animation: float 3s ease-in-out infinite;
        }

        .welcome {
            color: #777;

            font-size: 11px;

            letter-spacing: 5px;

            margin: 5px 0;
        }

        h1 {
            margin: 0;

            font-size: 48px;

            letter-spacing: 4px;
        }

        .tagline {
            color: #ffb300;

            font-weight: bold;

            margin-top: 8px;
        }

        .description {
            color: #888;

            font-size: 14px;

            margin: 25px 0;
        }

        /* Form */

        .form-group {
            text-align: left;

            margin-bottom: 18px;
        }

        label {
            display: block;

            color: #aaa;

            font-size: 13px;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 15px;

            border-radius: 12px;

            border: 1px solid #3b3b3b;

            background: #101010;

            color: white;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #ffb300;

            box-shadow:
                0 0 15px rgba(255, 179, 0, 0.12);
        }

        /* Button */

        .continue-button {
            width: 100%;

            padding: 16px;

            margin-top: 8px;

            border: none;

            border-radius: 13px;

            background: #ffb300;

            color: #111;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .continue-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 30px rgba(255, 179, 0, 0.25);
        }

        /* Profile preview */

        #profilePreview {
            display: none;

            margin-top: 25px;

            padding: 20px;

            background: #101010;

            border: 1px solid #292929;

            border-radius: 18px;
        }

        .avatar {
            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #ffb300;

            color: #111;

            font-size: 30px;

            font-weight: bold;
        }

        .profile-name {
            font-size: 22px;

            font-weight: bold;
        }

        .profile-info {
            color: #777;

            font-size: 13px;

            margin-top: 7px;
        }

        .enter-button {
            width: 100%;

            padding: 16px;

            margin-top: 20px;

            border: none;

            border-radius: 13px;

            background: #ffb300;

            color: #111;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .privacy {
            color: #555;

            font-size: 10px;

            margin-top: 20px;
        }

        /* Animation */

        @keyframes float {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

        }

        @media (max-width: 500px) {

            .card {
                padding: 25px 18px;
            }

            h1 {
                font-size: 40px;
            }

        }
    </style>
</head>

<body>

<div class="card">

    <!-- NOFOMO HEADER -->

    <div class="logo">
        📵
    </div>

    <p class="welcome">
        WELCOME TO
    </p>

    <h1>
        NOFOMO
    </h1>

    <p class="tagline">
        No Fear Of Missing Out
    </p>

    <p class="description">
        Create your Hunter profile and begin your journey.
    </p>


    <!-- PROFILE FORM -->

    <div id="profileForm">

        <div class="form-group">

            <label for="name">
                👤 Your Name
            </label>

            <input
                id="name"
                type="text"
                placeholder="Enter your name"
                maxlength="30"
            >

        </div>


        <div class="form-group">

            <label for="dob">
                🎂 Date of Birth
            </label>

            <input
                id="dob"
                type="date"
            >

        </div>


        <div class="form-group">

            <label for="location">
                📍 Location
            </label>

            <input
                id="location"
                type="text"
                placeholder="City / Area"
                maxlength="50"
            >

        </div>


        <button
            class="continue-button"
            onclick="createProfile()"
        >
            CREATE MY HUNTER PROFILE →
        </button>

    </div>


    <!-- PROFILE PREVIEW -->

    <div id="profilePreview">

        <div
            class="avatar"
            id="avatar"
        >
            ?
        </div>

        <div
            class="profile-name"
            id="profileName"
        >
            Hunter
        </div>

        <div
            class="profile-info"
            id="profileDOB"
        >
        </div>

        <div
            class="profile-info"
            id="profileLocation"
        >
        </div>


        <button
            class="enter-button"
            onclick="enterApp()"
        >
            🚀 ENTER NOFOMO
        </button>

    </div>


    <p class="privacy">
        Your profile is stored locally on this device.
    </p>

</div>


<script>

function createProfile() {

    const name =
        document.getElementById("name")
        .value.trim();

    const dob =
        document.getElementById("dob")
        .value;

    const location =
        document.getElementById("location")
        .value.trim();


    /* Validate name */

    if (name === "") {

        alert("Please enter your name.");

        return;
    }


    /* Validate date of birth */

    if (dob === "") {

        alert("Please select your date of birth.");

        return;
    }


    /* Validate location */

    if (location === "") {

        alert("Please enter your location.");

        return;
    }


    /* Show avatar */

    document.getElementById("avatar")
        .textContent =
        name.charAt(0).toUpperCase();


    /* Show name */

    document.getElementById("profileName")
        .textContent = name;


    /* Show DOB */

    document.getElementById("profileDOB")
        .textContent =
        "🎂 " + dob;


    /* Show location */

    document.getElementById("profileLocation")
        .textContent =
        "📍 " + location;


    /* Hide form */

    document.getElementById("profileForm")
        .style.display = "none";


    /* Show profile */

    document.getElementById("profilePreview")
        .style.display = "block";

}


/* ENTER NOFOMO */

function enterApp() {

    const name =
        document.getElementById("name")
        .value.trim();

    const dob =
        document.getElementById("dob")
        .value;

    const location =
        document.getElementById("location")
        .value.trim();


    /* Save profile */

    const profile = {

        name: name,

        dateOfBirth: dob,

        location: location,

        xp: 0,

        rank: "F",

        streak: 0,

        totalAwayMinutes: 0,

        bestStreak: 0,

        createdAt:
            new Date().toISOString()

    };


    localStorage.setItem(
        "nofomoProfile",
        JSON.stringify(profile)
    );


    localStorage.setItem(
        "nofomoOnboardingComplete",
        "true"
    );


    /*
       Your existing app should be
       named dashboard.html
    */

    window.location.href =
        "dashboard.html";
}

</script>

</body>
</html>
