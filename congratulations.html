<!DOCTYPE html>
<html>
<head>

    <title>Quest Complete</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0d0d12;
            color: white;
            text-align: center;
        }

        .box {
            width: 90%;
            max-width: 420px;
            padding: 35px 25px;
            border-radius: 28px;
            background: #191922;
            animation: appear .5s ease;
        }

        .trophy {
            font-size: 75px;
            animation: bounce 1s infinite alternate;
        }

        h1 {
            font-size: 30px;
            margin: 15px 0;
        }

        .quest {
            opacity: .7;
            margin-bottom: 20px;
        }

        .xp {
            font-size: 42px;
            font-weight: 900;
            margin: 20px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        @keyframes appear {

            from {
                transform: scale(.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }

        @keyframes bounce {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-10px);
            }

        }

    </style>

</head>


<body>

<div class="box">

    <div class="trophy">
        🏆
    </div>

    <h1>
        QUEST COMPLETE!
    </h1>

    <div class="quest" id="questName">
        Hunter Mission
    </div>

    <div class="xp">
        +<span id="reward">100</span> XP
    </div>

    <p>
        ⚔️ Your Hunter is getting stronger!
    </p>

    <button onclick="goBack()">
        CONTINUE HUNT
    </button>

</div>


<script>

    const params =
        new URLSearchParams(window.location.search);

    const reward =
        params.get("xp") || 100;

    const quest =
        params.get("quest") || "Hunter Mission";


    document.getElementById("reward")
        .textContent = reward;

    document.getElementById("questName")
        .textContent = quest;


    function goBack() {

        window.location.href = "quests.html";

    }

</script>

</body>
</html>
